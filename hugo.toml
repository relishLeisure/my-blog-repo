# Hugo Configuration for ezyang's blog
baseURL = 'https://relishleisure.github.io/'
languageCode = 'cn-zh'
title = "Truman's blog"
theme = 'ashley'
publishDir = "docs"

# Match WordPress permalink structure: /%year%/%monthnum%/%postname%/
[permalinks]
  posts = '/:year/:month/:slug/'

[params]
  description = "the arc of software bends towards understanding"
  author = "Truman."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML for legacy content
  [markup.highlight]
    style = 'monokai'
    lineNos = false
    codeFences = true

# RSS feed
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

# RSS feed alias - WordPress used /feed/
[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = 'weekly'
  priority = 0.5

# Pagination
[pagination]
  pagerSize = 10
